<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Media Suite</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="PDF Media Suite" class="brand-logo">
        <div class="brand-text">
          <h1 class="brand-title">PDF Media Suite</h1>
          <span class="brand-sub">Built-in PDF Viewer &amp; 130+ Tools</span>
        </div>
      </div>
      <div class="header-actions">
        <label class="auto-viewer-pill" title="Automatically open all PDFs in built-in Studio Viewer">
          <input type="checkbox" id="popup-auto-viewer" checked>
          <span>Auto Viewer</span>
        </label>
        <button class="icon-btn" id="btn-history" title="Recent Tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <a href="https://www.pdfmediasuite.in?utm_source=chrome_extension_popup" target="_blank" class="icon-btn" title="Open PDF Media Suite website">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </div>
    </header>

    <!-- Primary Built-in Studio PDF Viewer Hero Strip -->
    <div class="studio-launch-bar">
      <button class="studio-hero-btn" id="btn-launch-viewer">
        <span class="sh-left">
          <span class="sh-icon">📖</span>
          <span>
            <strong>Open PDF Viewer &amp; Studio Editor</strong>
            <small>View, Print, Sign, Compress, Merge &amp; Convert inside Chrome</small>
          </span>
        </span>
        <span class="sh-arrow">Launch →</span>
      </button>
    </div>

    <!-- PDF Detected Banner (shown when current tab has a PDF) -->
    <div class="pdf-detected-banner" id="pdf-detected-banner" style="display:none;">
      <div class="pdf-banner-left">
        <span class="pdf-banner-icon">📄</span>
        <div>
          <span class="pdf-banner-title">PDF Open in Tab!</span>
          <span class="pdf-banner-sub" id="pdf-banner-filename">Open right inside Studio Viewer</span>
        </div>
      </div>
      <div class="pdf-banner-actions">
        <button class="banner-btn banner-btn-red" id="banner-open-studio" title="Open in Built-in PDF Studio Viewer">📖 Edit Here</button>
        <button class="banner-btn" id="banner-compress" title="Compress in Studio Viewer">⚡ KB</button>
        <button class="banner-btn" id="banner-convert" title="Convert PDF to Word in Viewer">📝 Word</button>
      </div>
    </div>

    <!-- Recent Files Panel -->
    <div class="recent-panel" id="recent-panel" style="display:none;">
      <div class="recent-header">
        <span class="recent-title">🕐 Recently Used Tools</span>
        <button class="recent-clear" id="clear-recent">Clear</button>
      </div>
      <div class="recent-list" id="recent-list"></div>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="tool-search" placeholder="Search tools — viewer, print, sign, compress, merge, passport..." autocomplete="off" autofocus>
      <button id="clear-search" class="clear-search-btn" style="display:none;">&times;</button>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" data-category="popular">⭐ Popular</button>
      <button class="tab-btn" data-category="pdf">📄 In-Viewer PDF</button>
      <button class="tab-btn" data-category="convert">🔄 Convert</button>
      <button class="tab-btn" data-category="shop">🖨️ Cyber Cafe</button>
      <button class="tab-btn" data-category="sarkari">🇮🇳 Sarkari</button>
      <button class="tab-btn" data-category="image">🖼️ Image</button>
      <button class="tab-btn" data-category="security">🔒 Security</button>
      <button class="tab-btn" data-category="all">✨ All (130+)</button>
    </div>

    <!-- Quick Dropzone (Opens PDFs & Images directly inside built-in Studio Viewer!) -->
    <div class="quick-dropzone" id="quick-dropzone">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <div class="drop-text">
        <span class="drop-title">Drop PDF / Image to Open in Viewer</span>
        <span class="drop-sub">Opens instantly inside built-in PDF Studio — no upload wait!</span>
      </div>
      <input type="file" id="drop-file-input" accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp,.gif,.docx,.xlsx,.pptx" style="display:none;">
    </div>

    <!-- Tool Grid / Results -->
    <div class="tools-list" id="tools-list">
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="footer-privacy">🔒 Local Open-Source PDF Engine</span>
      <div class="footer-links">
        <a href="https://www.pdfmediasuite.in/all-tools?utm_source=chrome_extension_popup" target="_blank">Web Suite</a>
        <span>&bull;</span>
        <a href="https://www.pdfmediasuite.in/privacy?utm_source=chrome_extension_popup" target="_blank">Privacy</a>
        <span>&bull;</span>
        <span class="footer-shortcut">⌘⇧P</span>
      </div>
    </footer>
  </div>

  <script src="idb.js"></script>
  <script src="popup.js"></script>
</body>
</html>
