services:
  - type: web
    name: pdf-tool-backend
    env: python
    rootDir: backend
    buildCommand: ./render_build.sh
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker -w 2 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
